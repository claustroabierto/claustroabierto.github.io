<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>RA · Relicario — Museo Ayacucho</title>
  <link rel="stylesheet" href="../shared/styles.css?v=8" />
  <style>
    #panel .row button{background:var(--gold);color:#1a1206;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px;}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ar"></div>

  <div id="topbar">
    <div id="titulo">…</div>
    <div id="subtitulo"></div>
  </div>

  <div id="card">
    <button id="card-close">×</button>
    <div class="head">
      <div id="card-color"></div>
      <div>
        <div id="card-titulo"></div>
        <div id="card-pigmento"></div>
        <div id="card-formula"></div>
      </div>
    </div>
    <div id="card-nota"></div>
    <img id="card-img" alt="Microscopía" />
    <div id="card-imghint" class="hint">Toca para agrandar</div>
  </div>

  <div id="panel">
    <div class="row">
      <input id="reveal" type="range" min="0" max="100" value="50" />
      <button id="btn-toggle">Revelar</button>
      <button id="btn-repeat">↻ Repetir</button>
    </div>
    <div class="hint">Desliza para comparar el relicario con los Rayos X · Toca cada círculo para ampliar información</div>
    <div id="ficha-txt"></div>
  </div>

  <div id="loading">
    <div class="centro">
      <div class="sello">RA</div>
      <div class="expo">Un claustro abierto al mundo a través del arte</div>
      <div class="sede">Monasterio de Carmelitas Descalzas de Santa Teresa · Ayacucho</div>
      <div class="barra"><i></i></div>
      <div class="estado">Preparando la realidad aumentada…</div>
    </div>
    <div class="creditos">
      <img class="l-utec" src="../shared/logos/utec.webp" width="555" height="126"
           alt="UTEC · Centro de Investigación y Conservación del Patrimonio" />
      <img class="l-embajada" src="../shared/logos/embajada.webp" width="303" height="114"
           alt="Embajada de los Estados Unidos de América en Lima" />
    </div>
  </div>
  <div id="zoom"><img id="zoom-img" alt="Microscopía ampliada" /></div>
  <div id="error"></div>

  <script src="config.js?v=18"></script>
  <script type="module" src="relicario-engine.js?v=11"></script>
</body>
</html>
