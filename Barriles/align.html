<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Barriles · alinear a mano</title>
<style>:root{font-family:system-ui,sans-serif}*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0d0b12;color:#f4efe6;overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hint{position:fixed;left:0;right:0;top:0;z-index:5;text-align:center;padding:8px 12px;font-size:12px;opacity:.9;background:linear-gradient(#000c,#0000);pointer-events:none}
#hint b{color:#c9a24b}
#pill{position:fixed;left:8px;top:40px;z-index:6;background:#171320ee;border:1px solid #ffffff22;border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.55;font-variant-numeric:tabular-nums}
#pill .v{color:#c9a24b;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px;background:#0b0910ee;border-top:1px solid #ffffff22}
.bar button{pointer-events:auto;background:#221c30;color:#f4efe6;border:1px solid #ffffff33;border-radius:8px;padding:9px 11px;font-size:13px;min-width:44px}
.bar button:active{background:#3a2f52}
.bar .wide{min-width:92px}
#which{background:#c9a24b;color:#1a1206;font-weight:700}
.grp{display:flex;gap:4px;align-items:center;background:#00000033;border-radius:8px;padding:3px}
.grp small{opacity:.7;padding:0 4px}
#op{position:fixed;right:8px;top:40px;z-index:6;background:#171320ee;border:1px solid #ffffff22;border-radius:12px;padding:8px 10px;font-size:11px;text-align:center}
#op input{width:90px;display:block;margin-top:6px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<canvas id="c"></canvas>
<div id="hint">Arrastra para <b>mover</b> · pellizca para <b>escalar</b> · <b>foto/video</b> cambia cuál ajustas · <b>Copiar</b></div>
<div id="pill"><span id="lbl">foto</span> ·  width <span class="v" id="pw">–</span><br>height <span class="v" id="ph">–</span><br>x <span class="v" id="px">–</span> · y <span class="v" id="py">–</span></div>
<div id="op">barril<input id="opac" type="range" min="0" max="100" value="100"/></div>
<div class="bar">
  <button id="which">foto ⇄ video</button>
  <div class="grp"><small>X</small><button data-k="x" data-d="-1">◀</button><button data-k="x" data-d="1">▶</button></div>
  <div class="grp"><small>Y</small><button data-k="y" data-d="1">▲</button><button data-k="y" data-d="-1">▼</button></div>
  <div class="grp"><small>tamaño</small><button data-k="w" data-d="-1">−</button><button data-k="w" data-d="1">+</button></div>
  <button id="reset" class="wide">↺ Original</button>
  <button id="copy" class="wide">⧉ Copiar</button>
</div>
<script src="config.js"></script>
<script type="module">
import * as THREE from "three";
const CFG = window.MUSEO_CONFIG;
const SRC = { foto: CFG.fotoSrc, video: "assets/video-still.png" };
let which = "foto";
const G = { foto: { ...CFG.foto }, video: { ...CFG.video } };   // copias editables
const NUDGE = { x: 0.004, y: 0.004, w: 0.008 };

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
function resize() {
  renderer.setSize(innerWidth, innerHeight); const a = innerWidth / innerHeight;
  camera.aspect = a; camera.updateProjectionMatrix();
  const need = 2.4, halfV = Math.tan(THREE.MathUtils.degToRad(40) / 2);
  const dz = (a >= 1 ? need / 2 / (halfV * a) : need / 2 / halfV);
  camera.position.set(0, 0, Math.max(2.4, dz)); camera.lookAt(0, 0, 0);
}
addEventListener("resize", resize); resize();
function worldPerPx() { const halfV = Math.tan(THREE.MathUtils.degToRad(40) / 2); return (2 * halfV * camera.position.z) / innerHeight; }

const loader = new THREE.TextureLoader(); const tx = s => { const t = loader.load(s); t.colorSpace = THREE.SRGBColorSpace; return t; };
// barril (target preview) fijo en el origen, 1x1
const pieza = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ map: tx(CFG.targetPreview), transparent: true, depthTest: false }));
pieza.renderOrder = 0; scene.add(pieza);
// overlay editable
let ASP = 1, ovMesh = null;
function buildOverlay() {
  if (ovMesh) scene.remove(ovMesh);
  const img = new Image();
  img.onload = () => { ASP = img.width / img.height; rebuildMesh(); };
  img.src = SRC[which];
  function rebuildMesh() {
    const g = G[which];
    const t = tx(SRC[which]);
    ovMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1 / ASP),
      new THREE.MeshBasicMaterial({ map: t, transparent: true, depthTest: false, depthWrite: false }));
    ovMesh.renderOrder = 2; scene.add(ovMesh); apply();
  }
}
function apply() {
  const g = G[which]; if (!ovMesh) return;
  ovMesh.scale.set(g.w, g.w, 1); ovMesh.position.set(g.x, g.y, 0.02);
  document.getElementById("lbl").textContent = which;
  document.getElementById("pw").textContent = g.w.toFixed(3);
  document.getElementById("ph").textContent = (g.w / ASP).toFixed(3);
  document.getElementById("px").textContent = g.x.toFixed(3);
  document.getElementById("py").textContent = g.y.toFixed(3);
}
buildOverlay();
renderer.setAnimationLoop(() => renderer.render(scene, camera));

// arrastre + pellizco
const pts = new Map(); let pinch0 = 0, Wstart = 0;
canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); Wstart = G[which].w; } });
canvas.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return; const prev = pts.get(e.pointerId);
  if (pts.size === 1) { const wpp = worldPerPx(); G[which].x += (e.clientX - prev.x) * wpp; G[which].y -= (e.clientY - prev.y) * wpp; apply(); }
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0 > 0) { G[which].w = Math.max(0.2, Wstart * (d / pinch0)); apply(); } } });
function up(e) { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = 0; }
canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);
canvas.addEventListener("wheel", e => { e.preventDefault(); G[which].w = Math.max(0.2, G[which].w * (1 - e.deltaY * 0.0012)); apply(); }, { passive: false });

document.querySelectorAll(".bar button[data-k]").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.k, d = +b.dataset.d; G[which][k] += d * NUDGE[k]; apply(); }));
document.getElementById("which").addEventListener("click", () => { which = which === "foto" ? "video" : "foto"; buildOverlay(); });
document.getElementById("reset").addEventListener("click", () => { G[which] = { ...(which === "foto" ? CFG.foto : CFG.video) }; apply(); });
document.getElementById("opac").addEventListener("input", e => { pieza.material.opacity = e.target.value / 100; });
const copyBtn = document.getElementById("copy"); let ct = 0;
copyBtn.addEventListener("click", async () => {
  const g = G[which]; const h = +(g.w / ASP).toFixed(3);
  const line = `${which}: { w: ${+g.w.toFixed(3)}, h: ${h}, x: ${+g.x.toFixed(3)}, y: ${+g.y.toFixed(3)}, z: ${g.z != null ? g.z : (which === "foto" ? 0.02 : 0.18)} },`;
  try { await navigator.clipboard.writeText(line); } catch { const ta = document.createElement("textarea"); ta.value = line; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  copyBtn.textContent = "✓ copiado"; clearTimeout(ct); ct = setTimeout(() => copyBtn.textContent = "⧉ Copiar", 1500);
});
</script>
</body></html>
