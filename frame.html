<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Preview · tamaño de celular</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#15121c;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
  .top{color:#f4efe6;font-size:13px;opacity:.85;display:flex;gap:14px;align-items:center}
  .top a{color:#c9a24b;text-decoration:none}
  .top a:hover{text-decoration:underline}
  .top select{background:#241f30;color:#f4efe6;border:1px solid #ffffff2a;border-radius:8px;padding:4px 8px;font-size:12px}
  .phone{width:390px;height:844px;border-radius:38px;border:10px solid #2a2438;box-shadow:0 20px 70px #000a;overflow:hidden;background:#000;flex:0 0 auto}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <div class="top">
    <a href="preview.html">← todas las piezas</a>
    <span>·</span>
    <span>tamaño real de celular (390×844)</span>
    <span>·</span>
    <select id="zoom">
      <option value="1">100%</option>
      <option value="0.85">85%</option>
      <option value="0.7">70%</option>
      <option value="0.55">55%</option>
    </select>
  </div>
  <div class="phone" id="phone">
    <iframe id="f" title="preview"></iframe>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const pieza = params.get('pieza');
  if (pieza) document.getElementById('f').src = pieza + '/preview.html';

  const phone = document.getElementById('phone');
  function applyZoom() {
    const z = parseFloat(document.getElementById('zoom').value);
    phone.style.transform = `scale(${z})`;
    phone.style.transformOrigin = 'center center';
  }
  // Si la ventana es más chica que el celular a 100%, bajamos el zoom sola.
  function autofit() {
    const margin = 120; // deja lugar a la barra de arriba
    const availH = window.innerHeight - margin;
    const availW = window.innerWidth - 40;
    const z = Math.min(1, availH / 844, availW / 390);
    const opts = [1, 0.85, 0.7, 0.55];
    const closest = opts.reduce((a, b) => Math.abs(b - z) < Math.abs(a - z) && b <= z + 0.03 ? b : a, 1);
    document.getElementById('zoom').value = String(closest);
    applyZoom();
  }
  document.getElementById('zoom').addEventListener('change', applyZoom);
  autofit();
  window.addEventListener('resize', autofit);
</script>
</body>
</html>
